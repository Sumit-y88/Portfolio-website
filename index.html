<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />

    <title>My Portfolio | Sumit Yadav</title>
    <meta name="description" content="Sumit Yadav : Computer Engineering student skilled in React, Java, MySQL. View my projects, skills, and resume." />
    
    <!-- Open Graph / Social Tags -->
    <meta property="og:title" content="My Portfolio | Sumit Yadav" />

    <script>
      const savedTheme = localStorage.getItem("portfolio-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", savedTheme ? savedTheme === "dark" : prefersDark);
    </script>
  </head>
